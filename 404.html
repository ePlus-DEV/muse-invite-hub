<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>Page not found | Muse Invite Hub</title>
  <style>
    :root{color-scheme:light;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f6f9ff;color:#1c3152}
    main{max-width:460px;margin:24px;padding:32px;border:1px solid #d7e5fc;border-radius:18px;background:#fff;box-shadow:0 12px 36px #152b500d}
    h1{margin:0 0 12px;font-size:1.8rem}p{line-height:1.6;color:#4f607a}
    a{display:inline-block;margin-top:10px;padding:12px 18px;border-radius:10px;background:#1263eb;color:#fff;text-decoration:none;font-weight:700}
    a:focus-visible{outline:3px solid #80aeff;outline-offset:3px}
  </style>
</head>
<body>
  <main>
    <h1>Page not found</h1>
    <p id="fallback-message">This page may have moved or the preview may have expired.</p>
    <a href="/">Go to Muse Invite Hub</a>
  </main>
  <script id="muse-preview-fallback">
  (() => {
    "use strict";
    // GitHub Pages invokes this script on routes removed from a deployment.
    // Redirect only PR preview URLs; keep unrelated 404 routes untouched.
    const match = /^\/pr-preview\/pr-[1-9][0-9]*(?:\/(.*))?$/.exec(window.location.pathname);
    if (!match) return;
    const suffix = match[1] || "";
    const detail = /^codes\/([A-Z0-9-]{4,32})(?:\/(?:index\.html)?)?$/.exec(suffix);
    const message = document.getElementById("fallback-message");
    if (message) message.textContent = "This PR preview has expired. Opening the production website…";
    function redirect(path) {
      // Only navigate to a same-origin production path.
      const destination = new URL(path, window.location.origin);
      destination.search = window.location.search;
      destination.hash = window.location.hash;
      window.location.replace(destination.href);
    }
    // Country map is a stable, source-backed public route, unlike PR-only codes.
    if (/^countries(?:\/(?:index\.html)?)?$/.test(suffix)) {
      redirect("/countries/");
      return;
    }
    if (!detail) {
      redirect("/");
      return;
    }
    const code = detail[1];
    // Do not redirect to an unmerged code's missing production detail page.
    fetch("/data/invites.json", { cache: "no-store" })
      .then(response => response.ok ? response.json() : [])
      .then(entries => {
        const published = Array.isArray(entries) &&
          entries.some(entry => entry && entry.code === code);
        redirect(published ? "/codes/" + code + "/" : "/");
      })
      .catch(() => redirect("/"));
  })();
  </script>
</body>
</html>
