name: "⚑ Report Muse invite code feedback"
description: "Tell the community whether a code worked or failed, or report duplicates."
title: "[Code feedback] "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for keeping the directory useful. Do not include private account details, credentials or sensitive screenshots. Reports are community feedback, not official global validation.
  - type: input
    id: invite_code
    attributes:
      label: Invite code
      placeholder: "Code from this directory"
    validations:
      required: true
  - type: dropdown
    id: reason
    attributes:
      label: What happened?
      options:
        - Muse accepted the code (worked for me)
        - Muse did not accept the code
        - Muse says it is used or exhausted
        - I could not find the redeem option
        - Duplicate listing
        - Other
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Additional details (optional)
      description: "Non-sensitive error text and the date of your attempt may help."
    validations:
      required: false
