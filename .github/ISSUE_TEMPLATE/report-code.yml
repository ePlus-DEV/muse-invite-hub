name: "⚑ Report Muse invite code feedback"
description: "Tell the community whether a code worked or failed, or report duplicates."
title: "[Code feedback] "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for keeping the directory useful. Select the platform shown on the existing invite listing, not the platform of your own account. For example, GitHub @alex and Threads @alex are distinct accounts. The code identifies the listing and the platform must match it. Do not include credentials, private account details or sensitive screenshots. Reports are community feedback, not official global validation.
  - type: input
    id: invite_code
    attributes:
      label: Invite code
      placeholder: "Code from this directory"
    validations:
      required: true
  - type: input
    id: listing_platform
    attributes:
      label: Listing platform
      description: "GitHub or Threads. Prefilled when you click Give feedback on the website; editable before submission. The same @username on GitHub and Threads represents different accounts."
      placeholder: "GitHub or Threads"
    validations:
      required: true
  - type: dropdown
    id: reason
    attributes:
      label: What happened?
      options:
        - Muse accepted the code (worked for me)
        - Muse did not accept the code
        - Muse says it is used or exhausted
        - I could not find the redeem option
        - Duplicate listing
        - Other
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Additional details (optional)
      description: "Non-sensitive error text and the date of your attempt may help."
    validations:
      required: false
