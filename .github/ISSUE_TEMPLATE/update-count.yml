name: "↻ Update invite code remaining count (legacy)"
description: "Legacy fallback. For listed codes, use Update count on the existing code card/Issue."
title: "[Count update] "
body:
  - type: markdown
    attributes:
      value: |
        **Preferred:** visit https://muse.eplus.dev/#codes, select your existing invite code, and click **Update count**. You will add a comment to its original Issue; no duplicate Issue is needed. Use this legacy form only if the linked Issue cannot be found. GitHub Issues are public.
        Share only **numbers shown in your own Muse account**, not credentials or private account screenshots.
        Select the platform of the **listed invite code**, not your own login. Identical usernames on GitHub, Threads, X and Facebook are different identities.
        GitHub Issue ownership checks can confirm only the cataloged GitHub owner. **Threads, X and Facebook codes require manual owner verification** and will not receive automatic quota PRs.
        Updates are reviewed before changing the site. Counts are snapshots, NOT live Muse availability.
  - type: input
    id: invite_code
    attributes:
      label: Invite code
      description: "The public code whose count you want to update."
      placeholder: "DPNIHH"
    validations:
      required: true
  - type: dropdown
    id: listing_platform
    attributes:
      label: Listing platform
      description: "Choose the platform shown on the invite card. Matching usernames across services do not prove ownership."
      options:
        - GitHub
        - Threads
        - X (Twitter)
        - Facebook
    validations:
      required: true
  - type: input
    id: remaining
    attributes:
      label: Remaining invites shown by Muse
      description: "Enter a non-negative number displayed by your Invite screen. If you do not know, describe what you see below instead."
      placeholder: "e.g. 25"
    validations:
      required: false
  - type: input
    id: total
    attributes:
      label: Total invite quota shown by Muse (if known)
      description: "Only enter if visible. No assumed 30-invite limit."
      placeholder: "e.g. 30"
    validations:
      required: false
  - type: input
    id: used
    attributes:
      label: Already used invites (if known)
      description: "Only enter if visible or consistently calculated from Muse's displayed total and remaining."
      placeholder: "e.g. 5"
    validations:
      required: false
  - type: textarea
    id: details
    attributes:
      label: Additional context (optional)
      description: "When did you see the values? No account-sensitive details, tokens or private screenshots."
      placeholder: "Date and non-sensitive context..."
    validations:
      required: false
  - type: checkboxes
    id: confirmation
    attributes:
      label: Confirmation
      options:
        - label: "I confirm that these figures came from a Muse invite screen, not from copy-click counts or guesses."
          required: true
