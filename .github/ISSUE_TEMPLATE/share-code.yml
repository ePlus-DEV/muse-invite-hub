name: "✦ Share a Muse invite code"
description: "Share a public code, or contribute through Telegram without GitHub."
title: "[Invite] "
body:
  - type: markdown
    attributes:
      value: |
        **New codes only.** Check [existing codes](https://muse.eplus.dev/#codes) first. For a listed code, leave feedback on its page instead of creating another Issue.

        **Prefer Telegram?** [Open @muse_invite_hub_bot](https://t.me/muse_invite_hub_bot) to submit a code or report feedback without GitHub sign-in.

        Using GitHub? Share 1–10 codes (6 letters or digits each). For a code found on Threads, X or Facebook, include its original public post link. Issues are public. Share only codes you are allowed to publish; never include passwords, OTPs or private data.
  - type: textarea
    id: invite_code
    attributes:
      label: Invite code
      description: "Enter 1–10 unique 6-character codes (A–Z, 0–9), separated by commas, spaces or lines. If pasting a referral message, use one 'Code: ABC123' or 'Código: ABC123' line."
      placeholder: "ABC123, DEF456"
    validations:
      required: true
  - type: dropdown
    id: code_source
    attributes:
      label: Code source
      description: "Choose where the code came from. For Telegram submissions, prefer the bot above; Telegram sources entered here require manual review."
      options:
        - GitHub (my own code)
        - Threads (public code I found)
        - X (Twitter) (public code I found)
        - Facebook (public code I found)
        - Telegram (community code shared through bot)
    validations:
      required: true
  - type: input
    id: social_url
    attributes:
      label: Social post or profile URL (required for Threads, X or Facebook)
      description: "Link to the original public post containing the code. Profile-only or ambiguous links need manual review."
      placeholder: "https://x.com/username/status/123456789..."
    validations:
      required: false
  - type: input
    id: source_url
    attributes:
      label: Public confirmation or context (optional)
      description: "Optional supporting public link for your own GitHub code. For social sources, use the field above."
      placeholder: "https://..."
    validations:
      required: false
  - type: input
    id: reported_uses
    attributes:
      label: Uses so far (optional; self-reported)
      description: "Only for your own GitHub code, from your Muse screen; 0–30. Leave blank when submitting multiple codes."
      placeholder: "e.g. 1"
    validations:
      required: false
  - type: input
    id: reported_capacity
    attributes:
      label: Invite limit (optional; self-reported)
      description: "Only for your own GitHub code: maximum 30 invites per code. Enter the actual total only if known; do not assume every code starts with 30."
      placeholder: "e.g. 30"
    validations:
      required: false
  - type: input
    id: remaining
    attributes:
      label: Remaining invites (optional; self-reported)
      description: "Only for your own GitHub code, from your Muse invite screen; 0–30. Never infer remaining from the maximum."
      placeholder: "e.g. 17"
    validations:
      required: false
  - type: textarea
    id: notes
    attributes:
      label: Notes (optional)
      description: "Any useful context; do not promise rewards."
    validations:
      required: false
  - type: checkboxes
    id: consent
    attributes:
      label: Contributor checklist
      options:
        - label: "I am authorized to share this code publicly; I understand this Issue is public."
          required: true
        - label: "This code is not a password, 2FA code, session token or private credential."
          required: true
