name: "✦ Share a Muse invite code"
description: "Contribute a publicly shareable Muse invite/referral code."
title: "[Invite] "
body:
  - type: markdown
    attributes:
      value: |
        **For a new, unlisted code only.** Search https://muse.eplus.dev/#codes first. If the code already exists, use **Give feedback** or **Update count** on its card to comment in the original Issue instead of creating a duplicate. Issues are public. Choose **your own GitHub code** or a **public code found on Threads, X (Twitter) or Facebook**.
        For a social post, provide the original public post permalink: a profile alone cannot prove authorship and needs manual review. Facebook Group post links (/groups/GROUP/posts/POST_ID/) are allowed as group-level references only and always require human review; the group is not necessarily the post author. For Telegram contributions, use the bot so the sender can explicitly confirm their public @username; GitHub forms cannot verify Telegram identity, and these reports always require manual review. Your GitHub account is only the reporter, NOT automatically the owner of someone else's code.
        Muse's invite field shows six slots. Submit up to 10 six-character codes in one Issue (comma, space, or newline separated). One reviewed Draft PR keeps each code in a separate record. For multiple codes, do not fill per-code quota/count fields.
        Never submit passwords, authentication codes, sessions, cookies or private account information. All accepted reports produce review-only Draft PRs, never automatic publication.
  - type: textarea
    id: invite_code
    attributes:
      label: Invite code
      description: "Enter 1–10 distinct codes of exactly 6 letters (A–Z) or digits (0–9), without hyphens or spaces within a code. Lowercase letters are normalized. Separate multiple codes by commas, spaces, or new lines. If pasting the complete Muse referral message, include exactly one standalone 'Code: ABC123' or Spanish 'Código: ABC123' line; do not paste ambiguous codes. Never enter login or verification codes. For multiple codes, leave quota/count fields blank because they belong to individual codes."
      placeholder: "ABC123, DEF456"
    validations:
      required: true
  - type: dropdown
    id: code_source
    attributes:
      label: Code source
      description: "GitHub means your own code; social platforms are community reports, and Telegram needs bot attribution and manual review. Identical usernames on different platforms are different identities."
      options:
        - GitHub (my own code)
        - Threads (public code I found)
        - X (Twitter) (public code I found)
        - Facebook (public code I found)
        - Telegram (community code shared through bot)
    validations:
      required: true
  - type: input
    id: social_url
    attributes:
      label: Social post or profile URL (required for Threads, X or Facebook)
      description: "Paste the original public post containing the code: threads.com/@handle/post/ID, x.com/handle/status/ID, facebook.com/handle/posts/ID or facebook.com/groups/GROUP/posts/POST_ID/. Facebook Group links reference a group, not an identifiable post author, and require human review. Profile-only, share-shortlink or ambiguous URLs require manual review."
      placeholder: "https://x.com/username/status/123456789..."
    validations:
      required: false
  - type: input
    id: source_url
    attributes:
      label: Public confirmation or context (optional)
      description: "For your own GitHub code only: optional public HTTPS page you control or official Muse reference. For Threads, X or Facebook use the social URL field above."
      placeholder: "https://..."
    validations:
      required: false
  - type: input
    id: reported_uses
    attributes:
      label: Uses so far (optional; self-reported)
      description: "For your own GitHub code only, from your Muse invite screen. Never enter quotas found on another person's social profile."
      placeholder: "e.g. 1"
    validations:
      required: false
  - type: input
    id: reported_capacity
    attributes:
      label: Invite limit (optional; self-reported)
      description: "For GitHub-owned codes only, from your Muse account. Never guess."
      placeholder: "e.g. 30"
    validations:
      required: false
  - type: input
    id: remaining
    attributes:
      label: Remaining invites (optional; self-reported)
      description: "For your own GitHub code only; use your Muse account. Social-source reports cannot claim another user's invite quota."
      placeholder: "e.g. 17"
    validations:
      required: false
  - type: textarea
    id: notes
    attributes:
      label: Notes (optional)
      description: "Additional conditions or observations; do not promise rewards."
    validations:
      required: false
  - type: checkboxes
    id: consent
    attributes:
      label: Contributor checklist
      options:
        - label: "I am authorized to share this code publicly; I understand this Issue is public."
          required: true
        - label: "This code is not a password, 2FA code, session token or private credential."
          required: true
