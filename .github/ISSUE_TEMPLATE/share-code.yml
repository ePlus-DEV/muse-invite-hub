name: "✦ Share a Muse invite code"
description: "Contribute a publicly shareable Muse invite/referral code."
title: "[Invite] "
body:
  - type: markdown
    attributes:
      value: |
        **For a new, unlisted code only.** Search https://muse.eplus.dev/#codes first. If the code already exists, use **Give feedback** or **Update count** on its card to comment in the original Issue instead of creating a duplicate. Issues are public. Choose **your own GitHub code** or a **public code found on Threads, X (Twitter) or Facebook**.
        For a social post, provide the original public post permalink: a profile alone cannot prove authorship and needs manual review. Your GitHub account is only the reporter, NOT automatically the owner of someone else's code.
        Never submit passwords, authentication codes, sessions, cookies or private account information. All accepted reports produce review-only Draft PRs, never automatic publication.
  - type: input
    id: invite_code
    attributes:
      label: Invite code
      description: "A public Muse invite/referral code, not a login or verification code."
      placeholder: "Your Muse invite code"
    validations:
      required: true
  - type: dropdown
    id: code_source
    attributes:
      label: Code source
      description: "GitHub means your own code; other options mean a public code found on that platform. Identical usernames on different platforms are different identities."
      options:
        - GitHub (my own code)
        - Threads (public code I found)
        - X (Twitter) (public code I found)
        - Facebook (public code I found)
    validations:
      required: true
  - type: input
    id: social_url
    attributes:
      label: Social post or profile URL (required for Threads, X or Facebook)
      description: "Paste the original public post containing the code: threads.com/@handle/post/ID, x.com/handle/status/ID or facebook.com/handle/posts/ID. Profile-only, share-shortlink or ambiguous URLs require manual review."
      placeholder: "https://x.com/username/status/123456789..."
    validations:
      required: false
  - type: input
    id: source_url
    attributes:
      label: Public confirmation or context (optional)
      description: "For your own GitHub code only: optional public HTTPS page you control or official Muse reference. For Threads, X or Facebook use the social URL field above."
      placeholder: "https://..."
    validations:
      required: false
  - type: input
    id: reported_uses
    attributes:
      label: Uses so far (optional; self-reported)
      description: "For your own GitHub code only, from your Muse invite screen. Never enter quotas found on another person's social profile."
      placeholder: "e.g. 1"
    validations:
      required: false
  - type: input
    id: reported_capacity
    attributes:
      label: Invite limit (optional; self-reported)
      description: "For GitHub-owned codes only, from your Muse account. Never guess."
      placeholder: "e.g. 30"
    validations:
      required: false
  - type: input
    id: remaining
    attributes:
      label: Remaining invites (optional; self-reported)
      description: "For your own GitHub code only; use your Muse account. Social-source reports cannot claim another user's invite quota."
      placeholder: "e.g. 17"
    validations:
      required: false
  - type: textarea
    id: notes
    attributes:
      label: Notes (optional)
      description: "Additional conditions or observations; do not promise rewards."
    validations:
      required: false
  - type: checkboxes
    id: consent
    attributes:
      label: Contributor checklist
      options:
        - label: "I own this public code or am reporting a code explicitly shared publicly at the source URL above; this issue is public."
          required: true
        - label: "This code is not a password, 2FA code, session token or private credential."
          required: true
