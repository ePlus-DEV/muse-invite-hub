name: Conditional PR auto-merge

# Never execute untrusted PR scripts with the write-scoped workflow token.
# Newly submitted GitHub-owned public invite codes auto-publish as unverified
# after trusted record/Issue comparison and green CI. Documentation-only
# maintainer PRs also use safe default auto-merge.
# Social-source, updates, and all other PRs still require human approval.
on:
  pull_request_target:
    types: [ready_for_review, reopened, synchronize, labeled, unlabeled]
  pull_request_review:
    types: [submitted, dismissed]
  issue_comment:
    types: [created, edited]
  workflow_run:
    workflows: ["Validate website and invite catalog"]
    types: [completed]
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: read
  actions: write
  checks: read

# All merges target main. Serialize decisions to avoid racing independent PRs.
concurrency:
  group: muse-maintainer-auto-merge-main
  cancel-in-progress: false

jobs:
  merge:
    if: github.event_name != 'issue_comment' || github.event.issue.pull_request != null
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout trusted main only
        uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: false
      - name: Merge only a reviewed, green, current-head PR
        uses: actions/github-script@v8
        with:
          github-token: ${{ github.token }}
          script: |
            const { autoMergeDecision, verifyNewGithubInvitePR } = await import(
              process.env.GITHUB_WORKSPACE + "/scripts/auto-merge.mjs"
            );
            const { readCatalog } = await import(
              process.env.GITHUB_WORKSPACE + "/scripts/catalog.mjs"
            );
            const { AUTO_PUBLISH_NEW_INVITE_MARKER } = await import(
              process.env.GITHUB_WORKSPACE + "/scripts/issue-to-pr.mjs"
            );
            const { owner, repo } = context.repo;
            const fullName = owner + "/" + repo;
            const event = context.eventName;

            // In issue_comment and PR events, scan only the relevant PR.
            // In workflow_run, restrict to the completed validation head.
            // Scheduled reconciliation catches GITHUB_TOKEN-created PRs.
            const eventPr = (event === "issue_comment" ||
                event === "pull_request_review" ||
                event === "pull_request_target")
              ? (context.payload.issue?.number || context.payload.pull_request?.number)
              : null;
            const validatedHead = event === "workflow_run" &&
              context.payload.workflow_run?.conclusion === "success"
              ? context.payload.workflow_run.head_sha : null;

            if (event === "workflow_run" && !validatedHead) {
              core.info("Skipping unsuccessful CI run.");
              return;
            }

            const open = await github.paginate(github.rest.pulls.list, {
              owner,repo,state:"open",per_page:100
            });
            const candidates = open.filter(pr =>
              (!eventPr || pr.number === eventPr) &&
              (!validatedHead || pr.head.sha === validatedHead) &&
              !pr.draft && pr.base.ref === "main" &&
              pr.head.repo?.full_name === fullName
            );

            for (const candidate of candidates) {
              const number = candidate.number;
              const [fetched, comments, reviews, files] = await Promise.all([
                github.rest.pulls.get({owner,repo,pull_number:number}),
                github.paginate(github.rest.issues.listComments,
                  {owner,repo,issue_number:number,per_page:100}),
                github.paginate(github.rest.pulls.listReviews,
                  {owner,repo,pull_number:number,per_page:100}),
                github.paginate(github.rest.pulls.listFiles,
                  {owner,repo,pull_number:number,per_page:100})
              ]);
              const pr = fetched.data;
              let newInviteEligible = false;
              let sourceIssueNo = null;
              let sourceIssueUpdatedAt = null;
              const inviteMatch = /^auto\/issue-([1-9][0-9]*)-invite$/.exec(pr.head.ref);
              if (inviteMatch &&
                  pr.user?.login === "github-actions[bot]" &&
                  String(pr.body || "").includes(AUTO_PUBLISH_NEW_INVITE_MARKER) &&
                  files.length >= 1 && files.length <= 10 &&
                  files.every(f => f.status === "added" &&
                    /^data\/invite-records\/community-issue-[a-z0-9-]+\.json$/.test(f.filename))) {
                try {
                  const issue_number=Number(inviteMatch[1]);
                  const issue=(await github.rest.issues.get({
                    owner,repo,issue_number
                  })).data;
                  const fileContents={};
                  for (const file of files) {
                    const result=(await github.rest.repos.getContent({
                      owner,repo,path:file.filename,ref:pr.head.sha
                    })).data;
                    if (Array.isArray(result) || result.type !== "file" ||
                        result.encoding !== "base64" ||
                        typeof result.content !== "string" ||
                        result.size > 16000) {
                      throw Error("Invalid bot record contents: " + file.filename);
                    }
                    fileContents[file.filename] = Buffer.from(
                      result.content.replace(/\s/g,""),"base64"
                    ).toString("utf8");
                  }
                  newInviteEligible = verifyNewGithubInvitePR({
                    pr,issue,catalog:readCatalog(process.env.GITHUB_WORKSPACE),
                    files,fileContents,repo:fullName
                  });
                  if (newInviteEligible) {
                    sourceIssueNo=issue_number;
                    sourceIssueUpdatedAt=issue.updated_at;
                    core.info("PR #" + number + " matches original Issue #" +
                      issue_number + " and all generated invite records.");
                  }
                } catch (error) {
                  core.warning("PR #" + number +
                    " cannot auto-publish invite records: " + error.message);
                }
              }
              // Spend CI API quota only when this PR is either explicitly
              // authorized or is a trusted maintainer-authored docs-only
              // change eligible for either a verified new GitHub invite
              // or the default safe docs policy.
              const beforeCi = autoMergeDecision({
                pr,comments,reviews,files,newInviteEligible,runs:[],repo:fullName
              });
              if (beforeCi.reason !==
                "Current head SHA has no successful Validate website and invite catalog run.") {
                core.info("PR #" + number + ": " + beforeCi.reason);
                continue;
              }
              // Require the reviewed head to include current main. A green
              // test from an older base is not evidence for the newest base.
              const compared = await github.rest.repos.compareCommits({
                owner,repo,base:"main",head:pr.head.sha
              });
              if (compared.data.behind_by !== 0) {
                core.info("PR #" + number + " is behind main by " +
                  compared.data.behind_by + " commits; update and re-authorize.");
                continue;
              }
              const validations = await github.rest.actions.listWorkflowRuns({
                owner,repo,workflow_id:"validate.yml",head_sha:pr.head.sha,per_page:100
              });
              const decision = autoMergeDecision({
                pr,comments,reviews,files,newInviteEligible,
                runs:validations.data.workflow_runs,repo:fullName
              });
              if (!decision.eligible) {
                core.info("PR #" + number + ": " + decision.reason);
                continue;
              }
              // Re-read just before merging. SHA-bound authorizations and
              // GitHub's merge endpoint reject post-approval head changes.
              const latest = (await github.rest.pulls.get({
                owner,repo,pull_number:number
              })).data;
              if (latest.head.sha !== decision.sha ||
                  latest.base.sha !== pr.base.sha ||
                  latest.state !== "open" || latest.draft ||
                  latest.mergeable !== true || latest.mergeable_state !== "clean") {
                core.info("PR #" + number + " changed during approval; skipping.");
                continue;
              }
              if (sourceIssueNo !== null) {
                const issueNow=(await github.rest.issues.get({
                  owner,repo,issue_number:sourceIssueNo
                })).data;
                if (issueNow.state !== "open" ||
                    issueNow.updated_at !== sourceIssueUpdatedAt) {
                  core.info("PR #" + number +
                    " source Issue changed since validation; retry after re-check.");
                  continue;
                }
              }
              core.info("Merging authorized PR #" + number +
                " at " + decision.sha + " (authorization: " + decision.method + ").");
              let merged;
              try {
                merged = await github.rest.pulls.merge({
                  owner,repo,pull_number:number,sha:decision.sha,
                  merge_method:"squash"
                });
              } catch (error) {
                if ([403,405,409,422].includes(error.status)) {
                  core.warning("PR #" + number + " could not merge: " + error.message);
                  continue;
                }
                throw error;
              }
              if (!merged.data.merged) {
                core.warning("PR #" + number + " merge was not accepted.");
                continue;
              }
              // A merge authored by GITHUB_TOKEN does not trigger the usual
              // push-triggered Pages workflow. Dispatch trusted Pages explicitly.
              await github.rest.actions.createWorkflowDispatch({
                owner,repo,workflow_id:"pages.yml",ref:"main"
              });
              core.info("Merged PR #" + number +
                " and dispatched trusted production deployment.");
              // Main moved. Never merge another PR in the same run without
              // fresh mergeability and CI evaluation.
              break;
            }
