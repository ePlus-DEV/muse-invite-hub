name: Issue to Draft PR

# Only trusted default-branch code executes with write access.
# Untrusted Issue text is read as data and is NEVER embedded in shell commands.
on:
  issues:
    types: [opened, edited, reopened]
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Issue number to reprocess (0 = reconcile all eligible stuck Issues)"
        required: false
        default: 0
        type: number
  # Issues created by GITHUB_TOKEN automation do not fire `issues` events,
  # and a single failed run used to strand an Issue forever. Reconcile
  # provably stale open invite Issues on the same cadence as triage.
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: write

concurrency:
  # Issue-specific locks allowed two submissions of the same code to race.
  # Serialize all proposal writers. GitHub may replace pending runs; the
  # scheduled reconciler recovers Issues which never received a bot reply.
  group: muse-issue-proposal-writer
  cancel-in-progress: false

jobs:
  propose:
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      (github.event.issue.pull_request == null &&
       (startsWith(github.event.issue.title, '[Invite]') ||
        startsWith(github.event.issue.title, '[Count update]') ||
        startsWith(github.event.issue.title, '[Code feedback]') ||
        (startsWith(github.event.issue.title, '[Telegram submission]') &&
         contains(github.event.issue.body, 'muse-telegram-submission:')) ||
        (contains(github.event.issue.body, '### Invite code') &&
         contains(github.event.issue.body, '### Code source') &&
         contains(github.event.issue.body, '### Contributor checklist'))))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: false
      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Verify automation and catalog
        run: |
          node --check scripts/issue-to-pr.mjs
          node --check scripts/reconcile-stuck-issues.mjs
          node --test scripts/issue-to-pr.test.mjs
          node --test scripts/reconcile-stuck-issues.test.mjs
          node scripts/validate.mjs
      - name: Verify existing ePlus Bot credential
        env:
          GH_TOKEN: ${{ secrets.EPLUS_BOT_TOKEN }}
        run: |
          test -n "$GH_TOKEN" || { echo "::error::Missing EPLUS_BOT_TOKEN repository/organization Actions secret"; exit 1; }
          test "$(gh api user --jq .login)" = "eplus-bot" || {
            echo "::error::EPLUS_BOT_TOKEN must authenticate as eplus-bot"
            exit 1
          }
      - name: Create or update Issue proposal as eplus-bot
        if: github.event_name == 'issues' || (github.event_name == 'workflow_dispatch' && inputs.issue_number > 0)
        env:
          GH_TOKEN: ${{ secrets.EPLUS_BOT_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue_number }}
        run: node scripts/issue-to-pr.mjs
      - name: Reconcile stuck Issues as eplus-bot
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.issue_number == 0)
        env:
          GH_TOKEN: ${{ secrets.EPLUS_BOT_TOKEN }}
        run: node scripts/reconcile-stuck-issues.mjs
