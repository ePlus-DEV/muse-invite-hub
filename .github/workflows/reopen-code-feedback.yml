name: Reopen Code Feedback Issue

# Trusted main script only. Untrusted comments are inspected as data.
on:
  issue_comment:
    types: [created, edited]
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Canonical Issue number to reprocess"
        required: true
        type: number
      comment_id:
        description: "Original comment ID to reprocess"
        required: true
        type: number

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: write

concurrency:
  group: muse-feedback-issue-${{ github.event.issue.number || inputs.issue_number }}
  cancel-in-progress: false

jobs:
  reopen:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.issue.pull_request == null &&
      github.event.comment.user.type != 'Bot' &&
      github.event.comment.user.login != 'github-actions[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Verify trusted feedback handler
        run: |
          node --check scripts/reopen-code-feedback.mjs
          node --check scripts/feedback-comment-to-pr.mjs
          node --test scripts/code-issue-map.test.mjs scripts/feedback-comment-to-pr.test.mjs
      - name: Handle feedback or delete unrelated referral promotion
        id: moderation
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue_number }}
          COMMENT_ID: ${{ github.event.comment.id || inputs.comment_id }}
        run: node scripts/reopen-code-feedback.mjs
      - name: Propose review-only Draft PR for a structured report
        if: steps.moderation.outputs.deleted != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue_number }}
          COMMENT_ID: ${{ github.event.comment.id || inputs.comment_id }}
        run: node scripts/feedback-comment-to-pr.mjs
