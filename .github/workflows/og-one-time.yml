name: Materialize static OG PNG (temporary)
on:
  push:
    branches: [design/website-matched-og-image]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export-image:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: design/website-matched-og-image
          persist-credentials: true
      - name: Export website-matched OG as one-time static image
        run: |
          python3 -m venv .venv-og
          .venv-og/bin/python -m pip install --disable-pip-version-check Pillow==11.3.0 CairoSVG==2.8.2
          .venv-og/bin/python scripts/render-og.py
          test -s assets/social-preview.png
      - name: Commit binary image into PR branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f assets/social-preview.png
          if git diff --cached --quiet; then
            echo "No static image change."
            exit 0
          fi
          git commit -m "design(og): add generated 1200x630 static PNG"
          git push origin HEAD:design/website-matched-og-image
