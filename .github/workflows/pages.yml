name: Deploy website to GitHub Pages

# Always publish production from trusted main. Unmerged PR files are treated
# ONLY as static data. Their scripts are never executed in a privileged job.
on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request_target:
    branches: [main]
    # Open/synchronize/reopen PRs are published only after green validation via workflow_run.
    # Keep closed to remove preview directories promptly.
    types: [closed]
  workflow_run:
    workflows: ["Validate website and invite catalog"]
    types: [completed]

permissions:
  contents: read
  checks: read
  pull-requests: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: muse-invite-hub-pages-publish
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout trusted production source
        uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 1
      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Validate committed OG image (1200 x 630 PNG)
        run: |
          test -s assets/social-preview.png
          node -e 'const b = require("node:fs").readFileSync("assets/social-preview.png"); if(b.subarray(0, 8).toString("hex") !== "89504e470d0a1a0a" || b.readUInt32BE(16) !== 1200 || b.readUInt32BE(20) !== 630) { throw Error("Invalid OG image: expected PNG 1200x630"); } console.log("Static OG PNG verified: 1200x630");'
      - name: Validate production data and preview utilities
        run: |
          node scripts/validate.mjs
          node scripts/audit-links.mjs
          node --test scripts/validate.test.mjs scripts/preview.test.mjs scripts/preview-fallback.test.mjs scripts/audit-links.test.mjs
          node --check scripts/site-pages.mjs
          node --test scripts/site-pages.test.mjs scripts/verify-production.test.mjs scripts/seo-aeo.test.mjs scripts/page-skeleton.test.mjs scripts/directory-features.test.mjs scripts/copied-codes.test.mjs scripts/site-ui.test.mjs scripts/code-issue-map.test.mjs scripts/feedback-comment-to-pr.test.mjs
          node --check scripts/verify-production.mjs
          node --check assets/app.js
          node --check assets/detail.js
          node --check assets/site-ui.js
          node --check scripts/build-pages.mjs
          node --check scripts/code-issue-map.mjs
          node --check scripts/reopen-code-feedback.mjs
          node --check scripts/feedback-comment-to-pr.mjs
          node --check scripts/post-preview-status.mjs
          node --check scripts/close-accepted-issues.mjs
          node --test scripts/close-accepted-issues.test.mjs
      - name: Build main site and eligible PR previews
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/build-pages.mjs
      - name: Verify production and generated preview files
        run: |
          test -s _site/index.html
          test -s _site/404.html
          test -s _site/llms.txt
          test -s _site/assets/app.js
          test -s _site/assets/styles.css
          test -s _site/data/invites.json
          test -s _site/data/code-issues.json
          test -s _site/assets/detail.js
          test -s _site/assets/social-preview.png
          test -s _site/codes/DPNIHH/index.html
          test -s _site/pr-preview/manifest.json
          test -s _site/sitemap.xml
          grep -Fq 'rel="canonical" href="https://muse.eplus.dev/"' _site/index.html
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const entries = JSON.parse(fs.readFileSync('_site/data/invites.json', 'utf8'));
          const issueMap = JSON.parse(fs.readFileSync('_site/data/code-issues.json', 'utf8'));
          if (Object.keys(issueMap).length !== entries.length ||
              entries.some(item => !Number.isSafeInteger(issueMap[item.code]) || issueMap[item.code] <= 0)) {
            throw Error('Every published invite code must link to a canonical GitHub Issue');
          }
          const expectedUrls = [
            'https://muse.eplus.dev/',
            ...entries.map(({code}) => 'https://muse.eplus.dev/codes/' + code + '/')
          ];
          const sitemap = fs.readFileSync('_site/sitemap.xml', 'utf8');
          const actualUrls = [...sitemap.matchAll(/<loc>([^<]+)<\/loc>/g)].map(match => match[1]);
          if (JSON.stringify(actualUrls) !== JSON.stringify(expectedUrls)) {
            throw Error('Production sitemap must include Home and every published code exactly once');
          }
          for (const {code} of entries) {
            const html = fs.readFileSync('_site/codes/' + code + '/index.html', 'utf8');
            if (!html.includes('name="robots" content="index,follow"') ||
                !html.includes('rel="canonical" href="https://muse.eplus.dev/codes/' + code + '/"')) {
              throw Error('Invalid production robots or canonical for code ' + code);
            }
          }
          console.log('Verified '+entries.length+' indexable production code pages and sitemap URLs');
          const doc = JSON.parse(fs.readFileSync('_site/pr-preview/manifest.json','utf8'));
          for (const preview of doc.previews.filter(pr => pr.status === 'ready')) {
            const path = '_site/pr-preview/pr-'+preview.number+'/';
            const html = fs.readFileSync(path+'index.html','utf8');
            if (!html.includes('name="robots" content="noindex,nofollow,noarchive"') ||
                !html.includes('<base href="/pr-preview/pr-'+preview.number+'/">') ||
                !fs.existsSync(path+'assets/styles.css') ||
                !fs.existsSync(path+'assets/app.js') ||
                !fs.existsSync(path+'data/invites.json') ||
                !fs.existsSync(path+'data/code-issues.json') ||
                JSON.parse(fs.readFileSync(path+'preview-meta.json','utf8')).head_sha !== preview.head_sha) {
              throw Error('Invalid or incomplete preview #'+preview.number);
            }
            const metadata = JSON.parse(fs.readFileSync(path+'preview-meta.json','utf8'));
            if (metadata.detail_pages !== (preview.detail_pages ?? 0)) {
              throw Error('Mismatched deep-preview count #'+preview.number);
            }
            if (metadata.detail_pages > 0) {
              const list = JSON.parse(fs.readFileSync(path+'data/invites.json','utf8'));
              const example = list.find(item => item.featured === true) || list[0];
              const deep = path+'codes/'+example.code+'/index.html';
              if (!fs.existsSync(path+'assets/detail.js') ||
                  !fs.existsSync(path+'assets/social-preview.png') ||
                  !fs.existsSync(deep) ||
                  !fs.readFileSync(deep,'utf8').includes('noindex,nofollow,noarchive')) {
                throw Error('Missing nested code detail preview #'+preview.number);
              }
            }
          }
          console.log('Checked '+doc.previews.length+' eligible PRs');
          NODE
      - name: Refuse stale production deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          expected="$(git rev-parse HEAD)"
          latest="$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha')"
          if [ "$expected" != "$latest" ]; then
            echo "::error::Main changed while preparing Pages; a newer run will publish it."
            exit 1
          fi
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Upload complete site with current PR previews
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      # The artifact upload API may confirm success before deploy-pages can list
      # the new artifact. Allow GitHub's artifact metadata to become available.
      - name: Allow Pages artifact metadata to settle
        run: sleep 12
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
      - name: Verify live production detail, assets and sitemap after deployment
        run: node scripts/verify-production.mjs
      - name: Post preview links only after live asset checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/post-preview-status.mjs
      - name: Notify accepted contributors and close published Issues
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DEPLOYED_SHA="$(git rev-parse HEAD)" node scripts/close-accepted-issues.mjs
