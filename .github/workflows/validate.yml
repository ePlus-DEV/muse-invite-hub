name: Validate website and invite catalog

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  checks: read
  pull-requests: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Validate committed OG image (1200 x 630 PNG)
        run: |
          test -s assets/social-preview.png
          node -e 'const b = require("node:fs").readFileSync("assets/social-preview.png"); if(b.subarray(0, 8).toString("hex") !== "89504e470d0a1a0a" || b.readUInt32BE(16) !== 1200 || b.readUInt32BE(20) !== 630) { throw Error("Invalid OG image: expected PNG 1200x630"); } console.log("Static OG PNG verified: 1200x630");'
      - name: Test Node-only local HTTP server
        run: |
          node --check scripts/serve.mjs
          node --test scripts/serve.test.mjs scripts/node-only.test.mjs
      - name: Check frontend JavaScript syntax
        run: |
          node --check assets/app.js
          node --check assets/detail.js
          node --check assets/site-ui.js
      - name: Validate public invite catalog
        run: node scripts/validate.mjs
      - name: Test trusted Issue form parser
        run: |
          node --check scripts/issue-to-pr.mjs
          node --check scripts/code-issue-map.mjs
          node --check scripts/reopen-code-feedback.mjs
          node --test scripts/issue-to-pr.test.mjs scripts/close-accepted-issues.test.mjs
          node --check scripts/close-accepted-issues.mjs
      - name: Audit website and repository links
        run: node scripts/audit-links.mjs
      - name: Run catalog and link validation tests
        run: node --test scripts/validate.test.mjs scripts/audit-links.test.mjs
      - name: Verify static detail generation and PR preview renderer
        run: node --test scripts/preview.test.mjs scripts/preview-fallback.test.mjs scripts/site-pages.test.mjs scripts/seo-aeo.test.mjs scripts/page-skeleton.test.mjs scripts/directory-features.test.mjs scripts/site-ui.test.mjs scripts/code-issue-map.test.mjs
      - name: Dry-run production and live preview bundle (read-only)
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          MUSE_READONLY_BUILD: "1"
        run: |
          node scripts/build-pages.mjs
          test -s _site/index.html
          test -s _site/404.html
          test -s _site/llms.txt
          test -s _site/pr-preview/manifest.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const manifest = JSON.parse(fs.readFileSync('_site/pr-preview/manifest.json','utf8'));
          for(const pr of manifest.previews.filter(pr=>pr.status==='ready')){
            const dir = '_site/pr-preview/pr-'+pr.number+'/';
            const html = fs.readFileSync(dir+'index.html','utf8');
            if(!html.includes('name="robots" content="noindex,nofollow,noarchive"')) throw Error('Missing noindex on '+pr.number);
            if(!fs.existsSync(dir+'assets/app.js') || !fs.existsSync(dir+'assets/styles.css') || !fs.existsSync(dir+'data/invites.json')) throw Error('Missing base assets on '+pr.number);
            const meta = JSON.parse(fs.readFileSync(dir+'preview-meta.json','utf8'));
            if(meta.head_sha !== pr.head_sha) throw Error('Wrong preview head '+pr.number);
            if(meta.detail_pages !== (pr.detail_pages ?? 0)) throw Error('Wrong detail page count on '+pr.number);
            if(meta.detail_pages > 0){
              const list = JSON.parse(fs.readFileSync(dir+'data/invites.json','utf8'));
              const selected = list.find(item=>item.featured===true) || list[0];
              const detail = dir+'codes/'+selected.code+'/index.html';
              if(meta.detail_pages !== list.length || !fs.existsSync(dir+'assets/detail.js') || !fs.existsSync(detail) || !fs.readFileSync(detail,'utf8').includes('noindex,nofollow,noarchive')) throw Error('Missing verified nested detail page on '+pr.number);
            }
          }
          console.log('Read-only Pages bundle dry-run passed: '+manifest.previews.length+' PRs');
          NODE
      - name: Build downloadable PR preview
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/build-offline-preview.mjs
      - name: Upload downloadable PR preview
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/upload-artifact@v7
        with:
          name: muse-invite-hub-pr-preview-${{ github.event.pull_request.number }}
          path: _offline-preview/
          if-no-files-found: error
          retention-days: 14
