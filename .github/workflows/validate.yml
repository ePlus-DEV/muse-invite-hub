name: Validate website and invite catalog

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  checks: read
  pull-requests: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Check frontend JavaScript syntax
        run: |
          node --check assets/app.js
          node --check assets/detail.js
      - name: Validate public invite catalog
        run: node scripts/validate.mjs
      - name: Run catalog validation tests
        run: node --test scripts/validate.test.mjs
      - name: Verify static detail generation and PR preview renderer
        run: node --test scripts/preview.test.mjs scripts/site-pages.test.mjs
      - name: Dry-run production and live preview bundle (read-only)
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/build-pages.mjs
          test -s _site/index.html
          test -s _site/pr-preview/manifest.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const manifest = JSON.parse(fs.readFileSync('_site/pr-preview/manifest.json','utf8'));
          for(const pr of manifest.previews.filter(pr=>pr.status==='ready')){
            const dir = '_site/pr-preview/pr-'+pr.number+'/';
            const html = fs.readFileSync(dir+'index.html','utf8');
            if(!html.includes('name="robots" content="noindex,nofollow,noarchive"')) throw Error('Missing noindex on '+pr.number);
            if(!fs.existsSync(dir+'assets/app.js') || !fs.existsSync(dir+'assets/detail.js') || !fs.existsSync(dir+'assets/styles.css') || !fs.existsSync(dir+'data/invites.json')) throw Error('Missing assets on '+pr.number);
            if(!fs.existsSync(dir+'codes/DPNIHH/index.html') || !fs.readFileSync(dir+'codes/DPNIHH/index.html','utf8').includes('noindex,nofollow,noarchive')) throw Error('Missing private-index detail page on '+pr.number);
            if(JSON.parse(fs.readFileSync(dir+'preview-meta.json','utf8')).head_sha !== pr.head_sha) throw Error('Wrong preview head '+pr.number);
          }
          console.log('Read-only Pages bundle dry-run passed: '+manifest.previews.length+' PRs');
          NODE
      - name: Build downloadable PR preview
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/build-offline-preview.mjs
      - name: Upload downloadable PR preview
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/upload-artifact@v4
        with:
          name: muse-invite-hub-pr-preview-${{ github.event.pull_request.number }}
          path: _offline-preview/
          if-no-files-found: error
          retention-days: 14
