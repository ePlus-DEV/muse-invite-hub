name: Build Telegram OCI ARM64 image

# Manual build only, from trusted production main. Never push an image from an unmerged PR.
on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: muse-telegram-oci-image
  cancel-in-progress: false

jobs:
  image:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: false
      - name: Check Telegram syntax and behavior
        run: |
          node --check telegram/bot.mjs
          node --check telegram/github.mjs
          node --check telegram/server.mjs
          node --test telegram/telegram.test.mjs
      - name: Prepare QEMU
        uses: docker/setup-qemu-action@v4
      - name: Prepare Buildx
        uses: docker/setup-buildx-action@v4
      - name: Authenticate to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish linux/arm64 image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: telegram/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/eplus-dev/muse-invite-hub-telegram:latest
            ghcr.io/eplus-dev/muse-invite-hub-telegram:sha-${{ github.sha }}
          provenance: true
          sbom: true
