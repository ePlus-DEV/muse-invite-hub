<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4efff">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' https://telegram.org; style-src 'self'; img-src 'self' data:; connect-src 'self'; base-uri 'self'; form-action 'none'; object-src 'none'">
  <title>Muse Invite Hub · Mini App</title>
  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./styles.css">
  <script src="https://telegram.org/js/telegram-web-app.js" defer></script>
  <script type="module" src="./app.js"></script>
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="brand">
        <span class="brand-mark"><img src="../assets/favicon.svg" width="44" height="44" alt=""></span>
        <span class="brand-title">Muse <span>Invite Hub</span><small>COMMUNITY MINI APP</small></span>
      </div>
      <label class="language-picker">
        <span class="sr-only">Language</span>
        <select id="language" aria-label="Language">
          <option value="en">English</option><option value="vi">Tiếng Việt</option><option value="ja">日本語</option>
        </select>
      </label>
    </header>
    <div class="app-body">
      <div class="navigation" id="navigation" hidden>
        <button type="button" id="back" class="text-button">‹ Back</button>
        <span class="section-label" id="section-title"></span>
      </div>
      <main id="screen" aria-live="polite" aria-busy="false">
        <div class="loading"><span class="spinner"></span>Loading…</div>
      </main>
    </div>
    <nav class="bottom-nav" aria-label="Main navigation">
      <button type="button" data-nav="home"><span>⌂</span><small>Home</small></button>
      <button type="button" data-nav="browse"><span>🎟</span><small>Codes</small></button>
      <button type="button" data-nav="contribute"><span>＋</span><small>Share</small></button>
      <button type="button" data-nav="settings"><span>⚙</span><small>Settings</small></button>
    </nav>
  </div>
  <dialog id="confirm-dialog" aria-labelledby="confirm-title">
    <div class="dialog-inner">
      <h2 id="confirm-title"></h2>
      <p id="confirm-copy"></p>
      <div class="dialog-buttons">
        <button id="confirm-cancel" type="button" class="button secondary">Cancel</button>
        <button id="confirm-yes" type="button" class="button primary">Confirm</button>
      </div>
    </div>
  </dialog>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
